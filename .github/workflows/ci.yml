name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hbba
          POSTGRES_PASSWORD: hbba
          POSTGRES_DB: hbba
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U hbba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://hbba:hbba@localhost:5544/hbba
      JWT_SECRET: ci-only-secret-value-at-least-32-chars
      NODE_ENV: development
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Run tests
        run: npm test

      - name: Check the production config guards
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://hbba:hbba@localhost:5544/hbba
          JWT_SECRET: dev-only-change-me
        run: |
          if node -e "import('./server/config.js').then(m => m.getRuntimeConfig())" 2>/dev/null; then
            echo "Production guards did not reject an unsafe config"
            exit 1
          fi
          echo "Unsafe production config was rejected, as expected"
